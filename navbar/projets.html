
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/css.css">
<title>Projets</title>

<style>
    .travaux {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: black;
        position: relative;
    }

    .construction-container {
        text-align: center;
        z-index: 2;
        position: relative;
    }

    .construction-icon {
        font-size: 8rem;
        color: #800000;
        margin-bottom: 2rem;
        animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-20px); }
        60% { transform: translateY(-10px); }
    }

    .construction-title {
        font-size: 3.5rem;
        font-weight: 700;
        color: white;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #800000, #b74b4b, #800000);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 3s ease-in-out infinite;
    }

    @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }

    .construction-subtitle {
        font-size: 1.8rem;
        color: #ccc;
        margin-bottom: 3rem;
        opacity: 0.8;
    }

    .progress-container {
        width: 300px;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 auto 2rem;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #800000, #b74b4b);
        border-radius: 10px;
        width: 0%;
        animation: progressFill 3s ease-in-out infinite;
    }

    @keyframes progressFill {
        0% { width: 0%; }
        50% { width: 75%; }
        100% { width: 0%; }
    }

    .coming-soon {
        font-size: 1.4rem;
        color: #800000;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: pulse 2s ease-in-out infinite;
    }

    .floating-elements {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .floating-element {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #800000;
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
    }

    .floating-element:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
    .floating-element:nth-child(2) { top: 60%; left: 20%; animation-delay: 1s; }
    .floating-element:nth-child(3) { top: 30%; left: 80%; animation-delay: 2s; }
    .floating-element:nth-child(4) { top: 70%; left: 70%; animation-delay: 3s; }
    .floating-element:nth-child(5) { top: 40%; left: 50%; animation-delay: 4s; }

    @keyframes float {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .construction-icon { font-size: 6rem; }
        .construction-title { font-size: 2.5rem; }
        .construction-subtitle { font-size: 1.4rem; }
        .progress-container { width: 250px; }
    }
</style>

</head>
<body>

<header>
    <a href="/navbar/xxx.html" class="logo">6D6M</a>

    <div class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
    </div>

    <nav id="navbar">
        <a href="/html.html">Menu</a>
        <a href="#" class="active">Projets</a>
        <a href="/navbar/experience.html">Experience</a>
        <a href="/navbar/contact.html">Contact</a>
    </nav>
</header>

<section class="travaux">
    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>
    
    <div class="construction-container">
        <div class="construction-icon">
            <i class="fas fa-tools"></i>
        </div>
        
        <h1 class="construction-title">Projets en cours</h1>
        
        <p class="construction-subtitle">
            Je travaille actuellement sur de nouveaux projets passionnants.<br>
            Revenez bientôt pour les découvrir !
        </p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="coming-soon">Bientôt disponible</div>
    </div>
</section>

    <script>
    document.getElementById('menu-toggle').addEventListener('click', function () {
    document.getElementById('navbar').classList.toggle('active');
    });

    </script>
</body>
</html>
